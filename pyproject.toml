[project]
name = "agent"
version = "0.0.0"
description = "agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai==1.109.1",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "ripgrepy==2.2.0",
    "structlog==25.5.0",
    "click==8.5.0",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "prompt-toolkit==3.0.53",
    "requests==2.34.2",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires      = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.97",
]
