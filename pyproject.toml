[project]
name = "agent"
version = "0.0.0"
description = "agent"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai==3.51.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "ripgrepy==2.2.0",
    "structlog==26.1.0",
    "click==8.5.1",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "prompt-toolkit==3.0.53",
    "requests==2.34.2",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires      = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "ty==0.0.99",
]
